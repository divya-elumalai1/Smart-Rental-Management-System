# ===========================================
# Smart Rental Management - Application Config
# ===========================================

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param

# Spring Application
spring:
  application:
    name: smart-rental-management

  # Profile Configuration
  profiles:
    active: dev

  # Jackson Configuration
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: false
    property-naming-strategy: SNAKE_CASE

  # Database Configuration (PostgreSQL)
  datasource:
    url: jdbc:postgresql://localhost:5432/smart_rental_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      leak-detection-threshold: 60000

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
        order_inserts: true
        order_updates: true
        batch_size: 20
    open-in-view: false

  # Flyway Database Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 0
    baseline-description: Initial Schema

  # Mail Configuration (JavaMail)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    test-connection: false

  # Servlet Multipart (File Upload)
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB

  # Redis Configuration (Optional - for caching/sessions)
  # redis:
  #   host: localhost
  #   port: 6379
  #   password: ${REDIS_PASSWORD:}
  #   timeout: 2000ms

  # Task Scheduling
  task:
    scheduling:
      pool:
        size: 10
      thread-name-prefix: rental-scheduler-

# ===========================================
# JWT Configuration
# ===========================================
jwt:
  secret: ${JWT_SECRET:your-super-secret-jwt-key-min-256-bits-for-hs256-algorithm-change-in-production}
  expiration: 86400000 # 24 hours in milliseconds
  refresh-expiration: 604800000 # 7 days in milliseconds
  issuer: smart-rental-management
  header: Authorization
  token-prefix: "Bearer "

# ===========================================
# Razorpay Configuration
# ===========================================
razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  currency: INR
  payment-capture: true

# ===========================================
# Twilio Configuration (SMS)
# ===========================================
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  from-number: ${TWILIO_FROM_NUMBER:}
  messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}

# ===========================================
# Cloudinary Configuration (File Storage)
# ===========================================
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  secure: true
  folder: smart-rental
  allowed-formats: [jpg, jpeg, png, pdf, doc, docx]
  max-file-size: 10485760 # 10MB

# ===========================================
# OpenAI Configuration
# ===========================================
openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-3.5-turbo
  max-tokens: 1000
  temperature: 0.7
  timeout: 30000

# ===========================================
# Application Specific Configuration
# ===========================================
app:
  # Auth — skip email verification in local dev (seeded users)
  auth:
    skip-email-verification: ${SKIP_EMAIL_VERIFICATION:true}

  # Rent Reminder Configuration
  rent-reminder:
    enabled: true
    cron-expression: "0 0 9 * * ?" # Daily at 9 AM
    days-before-due: [7, 3, 1] # Remind 7, 3, 1 days before due date
    overdue-cron: "0 0 10 * * ?" # Daily at 10 AM for overdue

  # Maintenance Request Configuration
  maintenance:
    auto-assign: false
    sla-hours: 48
    escalation-hours: 72

  # Document Upload Configuration
  document:
    max-size: 10485760
    allowed-types: [application/pdf, image/jpeg, image/png, application/msword, application/vnd.openxmlformats-officedocument.wordprocessingml.document]

  # Pagination Defaults
  pagination:
    default-page-size: 20
    max-page-size: 100

  # CORS Configuration
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173,http://localhost:5174}
    allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

  # Rate Limiting
  rate-limit:
    max-requests: 100
    window-seconds: 60

# ===========================================
# Logging Configuration
# ===========================================
logging:
  level:
    com.smartrental: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/smart-rental.log
    max-size: 10MB
    max-history: 30

# ===========================================
# Actuator / Monitoring
# ===========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

# ===========================================
# OpenAPI / Swagger Configuration
# ===========================================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.smartrental.controller
  paths-to-match: /api/**
  default-produces-media-type: application/json
  default-consumes-media-type: application/json